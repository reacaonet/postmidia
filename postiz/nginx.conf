# Nginx do Postiz.
#
# Por que este arquivo existe no host:
# a imagem oficial fixa `listen 5000`, e o compose publicava 4007:5000. Isso
# deixa a URL da midia valida SÓ no navegador da maquina. O proprio Postiz, que
# roda DENTRO do container, gravava e ia buscar a imagem em
# http://localhost:4007/uploads/... e recebia ECONNREFUSED, porque dentro do
# container nada escutava na 4007. Com a guarda SSRF ligada o mesmo fetch caia
# em "Blocked IP", ja que 127.0.0.1 esta na lista de bloqueio.
#
# Escutar na 4007 dentro do container faz `localhost:4007` valer nos dois
# lados -- navegador e servidor -- sem reescrever URL nenhuma no banco.
#
# O proxy interno continua na 3000 (Nest) e o frontend na 4200, entao mexer
# apenas na porta de escuta. O unico lugar do codigo que citava 5000 era um
# fallback do Telegram, que so entra em uso se FRONTEND_URL estiver vazio.
#
# ATENCAO: copia do nginx.conf da imagem. Em atualizacao da imagem, se o
# upstream mudar o conf, este arquivo precisa ser reconciliado.
user                            www;
worker_processes                auto; # it will be determinate automatically by the number of core

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                 application/octet-stream;
    sendfile                     on;
    access_log                   /var/log/nginx/access.log;
    client_max_body_size 2G;
    server {
        listen 4007;
        server_name _;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location /api/ {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://localhost:4200/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}